name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'android_bridge.py', 'api/**', 'auth/**', 'cache/**', 'models.py', 'assets/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shop-checker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
